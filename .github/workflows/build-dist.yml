name: Build and publish dist

on:
  push:
    branches: [main]
    paths:
      - 'data/sources/nuget/pkg/**'
      - 'config/curated.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build dist JSON
        run: uv run scripts/build_dist.py

      - name: Build refdoc HTML
        run: uv run scripts/build_refdoc.py

      - name: Build refllm txt
        run: uv run scripts/build_refllm.py

      - name: Commit and push dist
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dist/
          if git diff --cached --quiet; then
            echo "No dist changes."
          else
            git commit -m "chore: rebuild dist [skip ci]"
            git push
          fi
