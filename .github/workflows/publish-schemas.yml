name: Publish schemas to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'schemas/**/*.schema.json'
      - 'data/dist/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: catalog

      - uses: actions/checkout@v4
        with:
          repository: uips-fixtures/uips-fixtures.github.io
          token: ${{ secrets.ORG_UIPSF_PAGES_PAT }}
          path: pages

      - name: Publish dist files to pages repo
        run: |
          python3 - << 'PYEOF'
          import glob, json, os, shutil
          from pathlib import Path

          DIST  = Path("catalog/data/dist")
          PAGES = Path("pages/src")

          # Wipe stale directories so removed files don't linger
          for d in ["refdoc", "llms", "catalog", "schemas"]:
              shutil.rmtree(PAGES / d, ignore_errors=True)

          # 1. Schemas → src/schemas/v0.2/
          for src in sorted(glob.glob("catalog/schemas/**/*.schema.json", recursive=True)):
              rel  = os.path.relpath(src, "catalog/schemas")
              dest = PAGES / "schemas" / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dest)
              print(f"  schema: {src} -> {dest}")

          html = txt = json_c = llms_c = 0

          for src in sorted(glob.glob(str(DIST / "**" / "*"), recursive=True)):
              src_path = Path(src)
              if not src_path.is_file():
                  continue
              # rel parts relative to DIST: (set, ...) or (set, pkg, ver.ext)
              parts = src_path.relative_to(DIST).parts

              if src_path.suffix == ".html" and len(parts) == 3:
                  # {set}/{pkg}/{ver}.html → refdoc/{pkg}/{ver}.html
                  dest = PAGES / "refdoc" / parts[1] / parts[2]
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dest)
                  html += 1

              elif src_path.suffix == ".txt" and len(parts) == 3:
                  # {set}/{pkg}/{ver}.txt → llms/{pkg}/{ver}.txt
                  dest = PAGES / "llms" / parts[1] / parts[2]
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dest)
                  txt += 1

              elif src_path.name == "llms.txt" and len(parts) == 2:
                  # {set}/llms.txt → llms/{set}.txt
                  dest = PAGES / "llms" / f"{parts[0]}.txt"
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dest)
                  llms_c += 1

              elif src_path.suffix == ".json" and src_path.name != "index.json" and len(parts) == 3:
                  # {set}/{pkg}/{ver}.json → catalog/{schema_ver}/{pkg}/{pkg}-{ver}.json (deduplicated)
                  doc = json.loads(src_path.read_text(encoding="utf-8"))
                  schema_ver = doc.get("schema", {}).get("version", "unknown")
                  filename = f"{parts[1]}-{src_path.stem}.json"
                  dest = PAGES / "catalog" / schema_ver / parts[1] / filename
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dest)
                  json_c += 1

              elif src_path.name == "index.json" and len(parts) == 2:
                  # {set}/index.json → catalog/{schema_ver}/{set}/index.json
                  doc = json.loads(src_path.read_text(encoding="utf-8"))
                  schema_ver = doc[0].get("metadata", {}).get("schema", {}).get("version", "unknown")
                  dest = PAGES / "catalog" / schema_ver / parts[0] / "index.json"
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dest)
                  json_c += 1

          print(f"refdoc: {html} html, llms: {txt} txt + {llms_c} set aggregations, catalog: {json_c} json")
          PYEOF

      - name: Commit and push
        working-directory: pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: publish schemas from catalog"
            git push
          fi
