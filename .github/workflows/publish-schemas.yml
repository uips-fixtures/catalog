name: Publish schemas to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'schemas/**/*.schema.json'
      - 'data/dist/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: catalog

      - uses: actions/checkout@v4
        with:
          repository: uips-fixtures/uips-fixtures.github.io
          token: ${{ secrets.ORG_UIPSF_PAGES_PAT }}
          path: pages

      - name: Publish dist files to pages repo
        run: |
          python3 - << 'PYEOF'
          import glob, json, os, shutil
          from pathlib import Path

          DIST  = Path("catalog/data/dist")
          PAGES = Path("pages/src")

          # Wipe stale directories so removed files don't linger
          # "catalog" held the old set-based JSON bundles — now replaced by llms/
          for d in ["refdoc", "llms", "schemas", "catalog"]:
              shutil.rmtree(PAGES / d, ignore_errors=True)

          # 1. Schemas
          for src in sorted(glob.glob("catalog/schemas/**/*.schema.json", recursive=True)):
              rel  = os.path.relpath(src, "catalog/schemas")
              dest = PAGES / "schemas" / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dest)
              print(f"  schema: {src} -> {dest}")

          html = json_c = llms_c = 0

          for src in sorted(glob.glob(str(DIST / "**" / "*"), recursive=True)):
              src_path = Path(src)
              if not src_path.is_file():
                  continue
              parts = src_path.relative_to(DIST).parts

              # data/dist/index.html → pages/src/index.html
              if src_path.name == "index.html" and len(parts) == 1:
                  dest = PAGES / "index.html"
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dest)
                  html += 1

              # data/dist/refdoc/index.html → pages/src/refdoc/index.html
              # data/dist/refdoc/{pkg}/index.html → pages/src/refdoc/{pkg}/index.html
              elif parts[0] == "refdoc" and src_path.suffix == ".html":
                  dest = PAGES / Path(*parts)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dest)
                  html += 1

              # data/dist/llms/{pkg}/llms.txt  → pages/src/llms/{pkg}/llms.txt
              # data/dist/llms/llms.txt        → pages/src/llms/llms.txt
              elif parts[0] == "llms" and src_path.suffix == ".txt":
                  dest = PAGES / Path(*parts)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dest)
                  llms_c += 1

              # data/dist/llms/{pkg}/{ver}.json → pages/src/llms/{pkg}/{ver}.json
              elif parts[0] == "llms" and src_path.suffix == ".json":
                  dest = PAGES / Path(*parts)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dest)
                  json_c += 1

          print(f"html: {html}, llms txt: {llms_c}, catalog json: {json_c}")
          PYEOF

      - name: Commit and push
        working-directory: pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: publish schemas from catalog"
            git push
          fi
