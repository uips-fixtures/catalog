name: Collect org repo metadata

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch public repos and write JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import json, os, urllib.request, urllib.parse
          from datetime import datetime, timezone

          org = "uips-fixtures"
          token = os.environ["GH_TOKEN"]
          now = datetime.now(timezone.utc)

          def gh_get(path):
              url = f"https://api.github.com{path}"
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          repos = []
          page = 1
          while True:
              batch = gh_get(f"/orgs/{org}/repos?type=public&per_page=100&page={page}")
              if not batch:
                  break
              repos.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          def age_days(iso):
              if not iso:
                  return None
              dt = datetime.fromisoformat(iso.replace("Z", "+00:00"))
              return (now - dt).days

          out = []
          for r in repos:
              license_id = None
              if r.get("license"):
                  license_id = r["license"].get("spdx_id")

              out.append({
                  "name":                 r["name"],
                  "full_name":            r["full_name"],
                  "description":          r.get("description"),
                  "html_url":             r["html_url"],
                  "fork":                 r["fork"],
                  "archived":             r["archived"],
                  "is_template":          r.get("is_template", False),
                  "default_branch":       r.get("default_branch"),
                  "language":             r.get("language"),
                  "license_spdx_id":      license_id,
                  "size_kb":              r.get("size"),
                  "topics":               r.get("topics", []),
                  "stargazers_count":     r["stargazers_count"],
                  "watchers_count":       r["watchers_count"],
                  "forks_count":          r["forks_count"],
                  "open_issues_count":    r["open_issues_count"],
                  "created_at":           r["created_at"],
                  "updated_at":           r["updated_at"],
                  "pushed_at":            r.get("pushed_at"),
                  "last_commit_age_days": age_days(r.get("pushed_at")),
              })

          out.sort(key=lambda x: x["name"])

          payload = {
              "schema": {
                  "version": "1.0",
                  "domain":  "org",
                  "type":    "repos",
              },
              "meta": {
                  "collectedAtUtc": now.strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "source":         f"https://api.github.com/orgs/{org}/repos",
                  "description":    f"Public repositories in the {org} GitHub organisation",
              },
              "stats": {
                  "repoCount": len(out),
              },
              "items": out,
          }

          path = "data/sources/org/repos.json"
          os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path, "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
              f.write("\n")

          print(f"Written {len(out)} repos to {path}")
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sources/org/repos.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: collect org repo metadata [skip ci]"
            git push
          fi
